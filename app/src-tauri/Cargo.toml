[package]
name = "linkord"
version = "1.2.7"
description = "Linkord desktop client"
edition = "2021"
publish = false

[lib]
name = "linkord_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"
# Already in the tree through tauri; the window-state save waits on its timer.
tokio = { version = "1", features = ["time"] }
# Used by the code tauri::generate_context! / generate_handler! expand to.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# WebKitGTK ships with microphone/camera access disabled; voice needs it switched on.
[target.'cfg(target_os = "linux")'.dependencies]
glib = "0.18"
webkit2gtk = { version = "2.0", features = ["v2_38"] }

# WebView2 remembers a "Block" on the mic prompt forever; the app grants its own media requests instead.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-capture = "2.0"
xcap = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rayon = "1"
base64 = "0.22"
# The League client's local API (league.rs); both already in the tree through the updater (ring, no aws-lc).
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# The #[implement] COM macro expands to paths in windows-core.
windows-core = "0.62"
# A point in Direct2D's signatures (overlay.rs).
windows-numerics = "0.3"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Media_MediaFoundation",
  "Win32_Media_DirectShow",
  "Win32_Media_Audio",
  # REC picks the microphone by its name (the one the app uses for voice).
  "Win32_Devices_FunctionDiscovery",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_System_Com",
  "Win32_UI_Shell",
  "Win32_Storage_FileSystem",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_Security",
  "Win32_System_SystemInformation",
  "Wdk_System_SystemServices",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Streams convert every frame on the CPU: unoptimized that takes 75 ms, which caps them at about 15 fps in `bun run desktop`.
[profile.dev.package.linkord]
opt-level = 2
