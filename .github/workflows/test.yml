name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: linkord
          POSTGRES_PASSWORD: linkord
          POSTGRES_DB: linkord_test
        ports: ['5433:5432']
        options: --health-cmd "pg_isready -U linkord" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Build web client
        working-directory: app
        run: pnpm install --frozen-lockfile && pnpm build
      - name: Server unit tests
        working-directory: server
        run: cargo test && cargo build
      - name: Start test server
        working-directory: server
        run: |
          mkdir -p /tmp/linkord-data
          LINKORD_BIND=127.0.0.1:7701 LINKORD_PUBLIC_URL=http://localhost:7701 \
          DATABASE_URL=postgres://linkord:linkord@127.0.0.1:5433/linkord_test \
          LINKORD_DATA_DIR=/tmp/linkord-data LINKORD_DEV_LOGIN=true \
          ./target/debug/linkord-server > /tmp/linkord-data/server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:7701/api/health && break; sleep 1; done
      - name: Install test tools
        working-directory: tests
        run: npm ci && npx -y playwright@1 install --with-deps chromium
      - name: API tests
        working-directory: tests
        env:
          LINKORD_TEST_URL: http://localhost:7701
        run: node --test --test-timeout=20000 api.test.mjs
      - name: UI tests
        working-directory: tests
        env:
          LINKORD_TEST_URL: http://localhost:7701
        run: CHROMIUM=$(ls -d ~/.cache/ms-playwright/chromium-*/chrome-linux64/chrome | tail -1) node ui.e2e.mjs
      - name: Server log on failure
        if: failure()
        run: cat /tmp/linkord-data/server.log
