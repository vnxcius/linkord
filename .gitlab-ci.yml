# CI for linkord on GitLab. Mirrors tests/run-local.sh (tests on every push / merge request) and
# app/build-*.sh (desktop installers on v* tags or when started by hand).
#
# CI/CD variables (Settings → CI/CD → Variables):
#   TAURI_SIGNING_KEY    type "File", protected + masked: contents of ~/.config/linkord/updater.key
#   LINKORD_SERVER_URL   optional, default server baked into desktop builds

stages: [test, build]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"

test:
  stage: test
  image: rust:1-trixie
  # A newer push cancels this run instead of letting both finish.
  interruptible: true
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_USER: linkord
    POSTGRES_PASSWORD: linkord
    POSTGRES_DB: linkord_test
    CARGO_HOME: $CI_PROJECT_DIR/.cargo
    BUN_INSTALL_CACHE_DIR: $CI_PROJECT_DIR/.bun-cache
    PLAYWRIGHT_BROWSERS_PATH: $CI_PROJECT_DIR/.playwright
    DATA: /tmp/linkord-data
    # No incremental state and only line tables: faster cold builds and a much smaller target/ to cache.
    CARGO_INCREMENTAL: "0"
    CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # One cache per toolchain, so a JS lockfile change keeps the Rust build (unchanged caches aren't re-uploaded).
  # Saved after failures too, or every failing run rebuilds the Rust deps and downloads Chromium again.
  cache:
    - key: { prefix: cargo, files: [server/Cargo.lock] }
      paths: [.cargo/registry, server/target, monitor/target]
      when: always
    - key: { prefix: bun, files: [app/bun.lock] }
      paths: [.bun-cache]
      when: always
    - key: { prefix: playwright, files: [tests/package-lock.json] }
      paths: [.playwright]
      when: always
  before_script:
    # ffmpeg: the server remuxes voice messages to Ogg with it (the UI test checks for .ogg)
    - curl -fsSL https://deb.nodesource.com/setup_24.x | bash - && apt-get install -y --no-install-recommends nodejs ffmpeg
  script:
    # Cheapest checks first, so a broken translation fails in seconds instead of after the Rust build.
    - (cd tests && node --test echo.test.mjs video-links.test.mjs i18n.test.mjs games.test.mjs)
    - npm i -g bun@1
    - (cd app && bun install --frozen-lockfile && bun run build)
    - (cd server && cargo test && cargo build)
    - (cd monitor/web && bun install --frozen-lockfile && bun run build)
    - (cd monitor && cargo test && cargo build)
    # The installed playwright-core picks the matching browser; the headless shell isn't used.
    - (cd tests && npm ci && npx playwright-core install --with-deps --no-shell chromium)
    # Throwaway server, same settings as tests/run-local.sh
    - mkdir -p "$DATA"
    - node tests/spotify-mock.mjs 7702 &
    - >
      cd server &&
      SPOTIFY_CLIENT_ID=test-client SPOTIFY_CLIENT_SECRET=test-secret SPOTIFY_POLL_MS=500
      SPOTIFY_ACCOUNTS_URL=http://localhost:7702 SPOTIFY_API_URL=http://localhost:7702
      LINKORD_DETECTABLE_URL=http://localhost:7702/detectable
      LINKORD_BIND=127.0.0.1:7701 LINKORD_PUBLIC_URL=http://localhost:7701 LINKORD_INTERNAL_BIND=127.0.0.1:7704
      LINKORD_DIRECT_BIND=127.0.0.1:7703 LINKORD_DIRECT_HOST=localhost LINKORD_DIRECT_TLS=off
      DATABASE_URL=postgres://linkord:linkord@postgres:5432/linkord_test
      LINKORD_DATA_DIR="$DATA" LINKORD_DEV_LOGIN=true DISCORD_CLIENT_ID= DISCORD_CLIENT_SECRET=
      ./target/debug/linkord-server > "$DATA/server.log" 2>&1 &
      cd "$CI_PROJECT_DIR"
    - for i in $(seq 1 60); do curl -sf localhost:7701/api/health && break; sleep 1; done
    - >
      cd monitor &&
      LINKORD_MONITOR_BIND=127.0.0.1:7705 LINKORD_MONITOR_PASSWORD=monitor-test-password LINKORD_MONITOR_DATA_DIR="$DATA/monitor"
      LINKORD_MONITOR_SERVER_DIR="$DATA/no-server-env" LINKORD_MONITOR_PROBE_INTERNET=off
      LINKORD_BIND=127.0.0.1:7701 LINKORD_PUBLIC_URL=http://localhost:7701 LINKORD_INTERNAL_BIND=127.0.0.1:7704
      DATABASE_URL=postgres://linkord:linkord@postgres:5432/linkord_test LINKORD_DATA_DIR="$DATA"
      ./target/debug/linkord-monitor > "$DATA/monitor.log" 2>&1 &
      cd "$CI_PROJECT_DIR"
    - for i in $(seq 1 60); do curl -sf localhost:7705/api/session && break; sleep 1; done
    - cd tests
    - export LINKORD_TEST_URL=http://localhost:7701 LINKORD_TEST_DATA_DIR="$DATA"
    - export CHROMIUM=$(ls -d "$PLAYWRIGHT_BROWSERS_PATH"/chromium-*/chrome-linux64/chrome | tail -1)
    - node --test --test-timeout=20000 api.test.mjs
    - MONITOR_TEST_URL=http://localhost:7705 LINKORD_INTERNAL_TEST_URL=http://127.0.0.1:7704 node --test --test-timeout=120000 monitor.test.mjs
    - E2E_FAILFAST=1 node ui.e2e.mjs
  after_script:
    - '[ "$CI_JOB_STATUS" = success ] || cat /tmp/linkord-data/server.log /tmp/linkord-data/monitor.log'

# Desktop installers, built with the same Dockerfiles as app/build-windows.sh / app/build-linux.sh.
.desktop:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  variables:
    DOCKER_BUILDKIT: "1"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
      allow_failure: true
  script:
    - cd app
    - docker build -f "$DOCKERFILE" $BUILD_ARGS
        --build-arg VITE_DEFAULT_SERVER="${LINKORD_SERVER_URL:-https://old.example.com}"
        --secret id=tauri_key,src="$TAURI_SIGNING_KEY"
        --output out .
  artifacts:
    paths: [app/out/]
    expire_in: 30 days

desktop:windows:
  extends: .desktop
  variables:
    DOCKERFILE: desktop.Dockerfile
    BUILD_ARGS: --build-arg PROFILE=release

desktop:linux:
  extends: .desktop
  variables:
    DOCKERFILE: desktop-linux.Dockerfile
    BUILD_ARGS: ""
